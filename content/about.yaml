# About page.

eyebrow: About
title: Earth Observation & Geospatial Data Science
intro: >-
  I develop remote sensing methods and turn them into working Python pipelines: a vineyard
  screened against its own history, ground motion checked against GNSS and levelling,
  smog forecasts and radar water extent checked against ground stations.
  Based in Poland.

# Portrait shown next to the intro. Path to a file in public/ (e.g. /about/dawid.jpg). Empty = hidden.
photo: ""

background:
  - >-
    My work starts from a question someone actually needs answered, for example
    "does this vineyard stand out from its own past seasons?" or "can this InSAR product be trusted for subsidence monitoring?".
    Then I build the pipeline and test it against independent ground measurements.
  - >-
    I fix acceptance criteria before computing results, I report every number with its error,
    and I publish negative results too. A layer that has not been validated is labelled as such.
  - >-
    Most of my tools are open: Copernicus data (Sentinel-1/2, ERA5-Land, EGMS), Python,
    Google Earth Engine and reproducible notebooks.

