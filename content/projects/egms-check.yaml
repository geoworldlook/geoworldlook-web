title: EGMS Check
tagline: Does satellite InSAR agree with the ground?
summary: >-
  Validation of the European Ground Motion Service (Sentinel-1 InSAR) against two independent kinds of
  ground truth: permanent GNSS stations in the Groningen gas field and state precise levelling in North
  Rhine-Westphalia. Acceptance criteria were fixed before any comparison was computed.
category: insar
icon: satellite
region: Groningen, NL · NRW, DE
date: 2026-10-13
status: active
featured: true
order: 2
image: /projects/egms-check.png

highlights:
  - "Groningen: 91% of station × track pairs agree within 1.5 mm/yr (slope 0.96)."
  - "North Rhine-Westphalia: slope 0.96 on 1,216 levelling benchmarks."
  - "100% sign agreement in subsidence bowls."
  - "A constant ≈ −2 mm/yr datum offset is reported as a failed pre-registered criterion."

tags: [Sentinel-1, InSAR, EGMS, GNSS, Levelling, Validation]

