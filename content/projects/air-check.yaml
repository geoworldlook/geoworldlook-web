# One file = one project (module). The file name is the URL: /analyses/air-check

title: Air Check
tagline: Is the air-quality forecast right in my city?
summary: >-
  A daily automatic check of the Copernicus (CAMS) fine-dust forecast against official ground stations in
  27 European cities. Every morning the system saves the new forecast, compares yesterday's forecast with
  what the stations measured, and updates the panel. The yardstick is the simplest forecast there is:
  "tomorrow will be like today". A forecast is useful in a city only if it beats this rule. A small correction
  learned from each station's past errors (model output statistics, MOS) is published next to the raw forecast.
category: air quality
icon: wind            # one of: sprout, satellite, layers, trees, thermometer, mountain, waves, radar, map, wind
region: PL · IT · FR · CH · SE · FI
date: 2026-11-17      # latest milestone, used for sorting
status: active        # active | completed | archived
featured: true        # shown on the home page
order: 3

highlights:
  - "Corrected forecast (MOS, rules fixed before the hold-out year was computed): beats “tomorrow = today” in 27 of 27 cities and the raw forecast in 27 of 27; median error 3.95 µg/m³ against 5.48 for the raw forecast and 5.16 for the rule."
  - "Largest gains where the raw forecast fails in winter: Katowice 18.8 → 4.8 µg/m³, Milano 17.4 → 6.7, Warszawa 10.2 → 5.5."
  - "Raw forecast, last 365 days: clearly better than the rule in 9 cities, clearly worse in 7 (large winter over-forecast), no clear difference in 11."
  - "27 cities in 6 countries, only stations with current data; checked every day without manual work (GitHub Actions). Live tests with rules fixed in advance: raw forecast 2026-11-16 to 2027-02-13, corrected forecast 2026-11-18 to 2027-02-15."

tags: [CAMS, Copernicus, PM2.5, Forecast verification, MOS, Validation, Pre-registration, GitHub Actions]

