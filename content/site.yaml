# Site settings: identity, contact, navigation and home page texts.
# Edit freely; the build fails with a clear message if a required field is missing.

name: GeoWorldLook
url: https://geoworldlook.vercel.app
title: GeoWorldLook | Earth observation by Dawid Sajewski
description: >-
  Earth-observation and geospatial data science projects built on open Copernicus data
  and validated against independent ground measurements.
author: Dawid Sajewski

contact:
  email: geo.world.look@gmail.com
  location: Poland
  # Formspree form ID (the part after formspree.io/f/). Empty = the form asks visitors to email you instead.
  formspreeId: ""
  intro: >-
    GeoWorldLook is where I publish Earth-observation topics and results. Want to talk about
    one of them, compare methods or work on something together? Connect with me on LinkedIn
    or send an email. Feel free to write in English, French or Italian.
  topics:
    - Methods for validating satellite products against ground data
    - Questions and feedback on AgriScreen, EGMS Check, Air Check or Water Check
    - Research collaboration on open-data projects
    - Conferences, hackathons and Earth-observation meetups

links:
  github: https://github.com/geoworldlook
  linkedin: https://www.linkedin.com/in/dawid-sajewski-12830b21b/

nav:
  - { label: Analyses, href: /analyses }
  - { label: Blog, href: /blog }
  - { label: About, href: /about }
  - { label: Contact, href: /contact }

footer:
  tagline: >-
    Satellite intelligence for real decisions.
    Earth-observation pipelines from open data, validated against the ground.

home:
  hero:
    badge: by Dawid Sajewski · remote sensing
    title: Earth Observation,
    titleAccent: Checked Against the Ground
    text: >-
      Topics and results from open satellite data: crops, ground motion, air quality and water.
      Every result here is checked against independent ground measurements, and negative
      results are published too.
    primary: { label: Explore Analyses, href: /analyses }
    secondary: { label: About me, href: /about }

  # Up to three short facts shown under the hero.
  stats:
    - { value: "4,783 days", label: of a dry-soil hint checked against soil sensors at 11 sites }
    - { value: "1,216", label: levelling benchmarks compared with EGMS InSAR }
    - { value: "35", label: GNSS stations in the Groningen validation }

  # Live monitoring section: one map card per source. Each source is a GeoJSON file that a project publishes
  # after every automatic run; the page reads it in the visitor's browser, so maps and readings are always current.
  # (Without sources, the section shows one map from a GeoJSON file in public/data/, set in "geojson".)
  map:
    enabled: true
    eyebrow: Live monitoring
    title: Checked against the ground, automatically
    text: >-
      Two systems compare Copernicus products with ground stations and publish the result without manual work.
      The maps and the readings below come straight from their latest runs.
    geojson: ""
    sources:
      - label: Air Check · smog forecast vs stations
        text: >-
          27 cities, every day. Each point: the PM2.5 measured at the station yesterday, the forecast for tomorrow
          (raw and corrected) and how the forecast has done against the rule "tomorrow = today".
        url: https://geoworldlook.github.io/air-check/showcase/map_points.geojson
        color: "#38bdf8"
        href: /analyses/air-check
        sort: reading
      - label: Water Check · radar water area vs gauges
        text: >-
          9 lakes and reservoirs, every day. Each point: the latest gauge level, the latest water area seen by
          Sentinel-1 radar and whether the two agree.
        url: https://geoworldlook.github.io/water-check/showcase/map_points.geojson
        color: "#10b981"
        href: /analyses/water-check
        sort: title
    note: >-
      Data: European Environment Agency, Copernicus Atmosphere Monitoring Service, Copernicus Sentinel-1 and national
      gauge networks (IMGW-PIB, SYKE, SMHI, Hub'Eau). Dot colour in the lists: green = confirmed,
      grey = no clear difference, amber = partly, red = not confirmed.

  # Project cards on the home page come from content/projects (featured: true).

  cta:
    title: Let's connect
    text: >-
      I share new results and short write-ups on LinkedIn, in English, French and Italian.
      Happy to talk about Earth observation, validation of satellite products and geospatial data science.
    button: { label: Connect on LinkedIn, href: "https://www.linkedin.com/in/dawid-sajewski-12830b21b/" }
